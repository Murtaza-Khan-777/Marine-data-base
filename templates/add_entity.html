<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Add Entity' if user.role == 'admin' else 'Propose Entity' }} | MarineNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> select { -webkit-appearance: none; -moz-appearance: none; appearance: none; } </style>
</head>
<body class="bg-[#050510] text-white font-sans p-8 flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <div class="fixed inset-0 z-0 h-screen overflow-hidden bg-black pointer-events-none">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=2000" class="w-full h-full object-cover opacity-30 mix-blend-lighten">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/80 via-[#050510]/90 to-teal-900/80"></div>
    </div>

    <div class="relative z-10 max-w-xl w-full bg-[#0a0a1a]/70 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-cyan-400 uppercase tracking-widest">
            {{ 'Add Database Entity' if user.role == 'admin' else 'Propose New Entity' }}
        </h1>
        <p class="text-xs text-white/50 mb-8 tracking-widest">
            {% if user.role == 'researcher' %}Submissions require admin review.{% else %}Directly modifies live DB.{% endif %}
        </p>

        <!-- Form 1: Trigger page reload to switch fields using purely GET and Jinja -->
        <form action="/add_entity" method="GET" class="mb-4">
            <select name="type" onchange="this.form.submit()" class="w-full bg-black/40 border border-white/20 rounded-lg p-3 outline-none focus:border-cyan-400 cursor-pointer text-sm">
                <option value="species" {% if selected_type == 'species' %}selected{% endif %}>Species Entry</option>
                <option value="habitat" {% if selected_type == 'habitat' %}selected{% endif %}>Habitat Entry</option>
            </select>
            <noscript><button type="submit" class="mt-2 bg-cyan-900 px-4 py-2 text-xs rounded">Load Fields</button></noscript>
        </form>

        <!-- Form 2: The actual POST submission -->
        <form action="/add_entity" method="POST" class="flex flex-col gap-3">
            <input type="hidden" name="entity_type" value="{{ selected_type }}">
            
            {% if selected_type == 'species' %}
                <input type="text" name="name" placeholder="Species Name" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="text" name="type" placeholder="Type (e.g. Fish, Reptile)" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="number" name="lifespan" placeholder="Lifespan (Years)" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="text" name="status" placeholder="Conservation Status" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="text" name="habitat" placeholder="Associated Habitat Name" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="text" name="climate" placeholder="Climate / Region" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="url" name="img" placeholder="Species Subject Image URL" class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
            {% elif selected_type == 'habitat' %}
                <input type="text" name="name" placeholder="Habitat Name" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="text" name="location" placeholder="Geographic Description" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="number" step="any" name="latitude" placeholder="Latitude" class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="number" step="any" name="longitude" placeholder="Longitude" class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="text" name="climate" placeholder="Climate" required class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
                <input type="url" name="img" placeholder="Habitat Background URL" class="bg-black/40 border border-white/20 rounded-lg p-3 text-sm focus:border-cyan-400 outline-none">
            {% endif %}

            <div class="flex justify-between items-center mt-6 pt-4 border-t border-white/10">
                <a href="/home" class="text-sm text-white/50 hover:text-white transition-colors">Cancel</a>
                <button type="submit" class="bg-cyan-900/60 hover:bg-cyan-800 border border-cyan-500/50 px-6 py-3 rounded-lg font-bold uppercase tracking-widest text-xs">
                    {{ 'Submit to Database' if user.role == 'admin' else 'Submit Proposal' }}
                </button>
            </div>
        </form>
    </div>
</body>
</html>
