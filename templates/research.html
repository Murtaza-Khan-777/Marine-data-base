<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ research.topic }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#050510] text-white font-sans h-screen flex flex-col overflow-hidden">
    
    <nav class="w-full p-6 flex justify-between items-center border-b border-white/10 bg-[#0a0a1a]">
        <div class="flex items-center gap-6">
            <a href="/home" class="text-white/50 hover:text-cyan-400 flex items-center text-sm uppercase tracking-widest"><i class="fa-solid fa-house mr-2"></i> Home</a>
            <a href="/species" class="text-white/50 hover:text-cyan-400 flex items-center text-sm uppercase tracking-widest"><i class="fa-solid fa-arrow-left mr-2"></i> Database</a>
        </div>
        <div class="border border-cyan-500/30 text-cyan-400 px-4 py-1 uppercase tracking-widest text-xs rounded-full font-bold">Research Log #{{ research.id }}</div>
    </nav>

    <div class="flex-1 flex flex-col md:flex-row w-full h-full overflow-hidden">
        <div class="w-full md:w-1/3 p-8 bg-[#050510] flex flex-col border-r border-white/10 overflow-y-auto">
            <h1 class="text-3xl font-bold mb-4">{{ research.topic }}</h1>
            <div class="flex items-center text-sm text-cyan-400 mb-2 border-b border-white/10 pb-4">Published: {{ research.date }}</div>
            <div class="text-xs text-purple-400 mb-8 uppercase tracking-widest">
                <i class="fa-solid fa-microscope mr-1"></i> Researcher: <a href="/researcher/{{ research.researcher }}" class="underline">{{ research.researcher }}</a>
            </div>
            <h3 class="uppercase tracking-widest text-xs text-white/50 mb-2">Description</h3>
            <p class="text-gray-300 text-sm leading-relaxed mb-8">{{ research.description }}</p>
            
            <a href="{{ research.pdf_url }}" download class="block w-full text-center bg-cyan-900/50 border border-cyan-500/50 text-cyan-50 font-bold uppercase tracking-widest text-sm py-4 rounded-lg mb-4">Download PDF</a>

            {% if user.role == 'admin' %}
            <a href="/admin/flag_research/{{ research.id }}" class="block text-center bg-red-900/40 border border-red-500/30 text-red-300 font-bold uppercase tracking-widest text-xs py-3 rounded-lg"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Flag & Strike Author</a>
            {% endif %}
        </div>

        <div class="w-full md:w-2/3 h-full bg-[#1a1a2e] relative">
            <iframe src="{{ research.pdf_url }}" class="w-full h-full border-none shadow-inner"></iframe>
        </div>
    </div>
</body>
</html>
